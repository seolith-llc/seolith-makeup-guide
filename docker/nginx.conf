# nginx site config for Blendwise (see docs/architecture.md "Release checklist").
# TLS is expected to terminate in front of this container (reverse proxy or platform load balancer).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    # Enable once the site is served over HTTPS in production:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # Entry points that must always be revalidated so installed clients see new versions
    location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/conf.d/security-headers.inc; }
    location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/conf.d/security-headers.inc; }
    location = /manifest.webmanifest {
        # .webmanifest is not in every nginx mime.types; a `types` block here would replace the whole table, so set the default instead
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Code and data: short browser cache; the service worker bypasses HTTP cache when it precaches a new version
    location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=3600, must-revalidate" always; include /etc/nginx/conf.d/security-headers.inc; }

    # Icons never change without a rename
    location ~* \.(png|svg|ico)$ { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/conf.d/security-headers.inc; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
